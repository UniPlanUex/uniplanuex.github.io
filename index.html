<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="UniPlan: cupones de comercios de Badajoz y Cáceres que se desbloquean al quedar en grupo. El cupón es la excusa, el grupo es el plan.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-48.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; font: 14px/1.4 system-ui, -apple-system, sans-serif; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<title>UniPlan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="UniPlan">
<meta name="theme-color" content="#F7F7F5">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
</head>
<body>
<style>
/* Layout: columna de app móvil (máx. 480px) con cabeceras pegajosas y barra inferior fija, igual que la app Android. */
:root {
  --green: #1F8A5B;
  --green-dark: #166B46;
  --green-soft: #E3F4EC;
  --teal: #14B48A;
  --yellow: #F5A623;
  --yellow-soft: #FFF1D9;
  --amber-text: #8F5B00;
  --bg: #F7F7F5;
  --surface: #FFFFFF;
  --surface-2: #F0F1EE;
  --fg: #1B1D1B;
  --muted: #5C625E;
  --line: #E2E5E1;
  --mine: #B0277A;
  --on-accent: #FFFFFF;
  --shadow: 0 1px 2px rgba(20, 40, 30, .08), 0 2px 8px rgba(20, 40, 30, .06);
  --font-display: "Nunito", ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
  --font-body: "Nunito Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --nav-h: 64px;
}
:root.dark {
  --green: #3DB07C;
  --green-dark: #2A8C60;
  --green-soft: #1D3A2C;
  --teal: #2CC79C;
  --yellow: #F5A623;
  --yellow-soft: #4A3A1A;
  --amber-text: #FFCB73;
  --bg: #121412;
  --surface: #1E211F;
  --surface-2: #2A2E2B;
  --fg: #E6E8E5;
  --muted: #B3B9B4;
  --line: #343935;
  --mine: #C2408F;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg);
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--green); }
:focus-visible { outline: 2.5px solid var(--teal); outline-offset: 2px; }
#app {
  max-width: 480px; margin: 0 auto; min-height: 100%;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(var(--nav-h) + 24px + env(safe-area-inset-bottom, 0px));
}
#app.no-nav { padding-block-end: calc(96px + env(safe-area-inset-bottom, 0px)); }
#app.chat-mode { padding-block-end: 0; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; align-items: center; gap: 8px; min-width: 0; }
.grow { flex: 1; min-width: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.tiny { font-size: 12px; }
.bold { font-weight: 700; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; letter-spacing: -.01em; }
h1 { font-size: 28px; font-weight: 900; }
h2 { font-size: 22px; font-weight: 900; }
h3 { font-size: 17px; font-weight: 800; }
p { margin: 0; }

/* Logo */
.logo { font-family: var(--font-display); font-weight: 900; font-size: 24px; letter-spacing: -.02em; }
.logo .u { color: var(--teal); } .logo .p { color: var(--yellow); }

/* Cabecera de inicio */
.home-head { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding-block: 10px 6px; }
.city { justify-self: start; display: inline-flex; align-items: center; gap: 4px; background: none; border: 0; padding: 8px 4px; font-weight: 700; }
.city svg { color: var(--green); }
.bell { justify-self: end; position: relative; background: none; border: 0; padding: 8px; }
.badge { position: absolute; top: 2px; right: 0; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 9px; background: #C62828; color: #fff; font-size: 11px; font-weight: 800; display: grid; place-items: center; }
.menu { position: absolute; z-index: 20; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 4px; min-width: 160px; }
.menu button { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 10px 12px; border-radius: 8px; }
.menu button:hover { background: var(--surface-2); }

.hero { border-radius: 20px; overflow: hidden; background: #166B46; color: #fff; display: flex; flex-direction: column; }
.hero img { display: block; width: 100%; max-width: 100%; height: auto; aspect-ratio: 2 / 1; object-fit: cover; }
.hero h2 { color: #fff; font-size: 23px; line-height: 1.15; padding: 2px 16px 16px; }
.hero h2 em { color: #F5A623; font-style: normal; }

/* Chips */
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin-inline: -4px; padding: 2px 4px; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 10px;
  padding: 7px 12px; font-weight: 600; font-size: 14px; white-space: nowrap;
}
.chip[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: var(--on-accent); }
.chip.y[aria-pressed="true"] { background: var(--yellow); border-color: var(--yellow); color: #fff; }

/* Tarjeta de cupón */
.coupon {
  display: flex; background: var(--surface); border-radius: 16px; overflow: hidden; box-shadow: var(--shadow);
  border: 1.5px solid transparent; text-align: left; padding: 0; width: 100%;
}
.coupon.featured { border-color: var(--yellow); }
.tile { background: var(--green); display: grid; place-items: center; font-size: 42px; flex: none; }
.coupon .tile { width: 104px; }
.coupon .body { flex: 1; min-width: 0; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.coupon .title { font-family: var(--font-display); font-weight: 800; font-size: 17px; line-height: 1.2; }
.kind { font-size: 13px; font-weight: 700; }
.kind.group { color: var(--green); } .kind.solo { color: var(--amber-text); }
.btn {
  border: 0; border-radius: 999px; background: var(--green); color: var(--on-accent);
  font-weight: 700; padding: 8px 16px; min-height: 36px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none;
}
.btn.y { background: var(--yellow); color: #fff; }
.btn.ghost { background: transparent; color: var(--green); border: 1.5px solid var(--green); }
.btn.text { background: transparent; color: var(--green); padding-inline: 8px; }
.btn.block { width: 100%; min-height: 50px; font-size: 16px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }

/* Secciones */
.section-head { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
.hscroll { display: flex; gap: 12px; overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding: 4px 16px 8px; scroll-snap-type: x proximity; }
.hscroll::-webkit-scrollbar { display: none; }
.mini { flex: none; width: 152px; background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); padding: 12px; text-align: left; border: 0; scroll-snap-align: start; display: flex; flex-direction: column; gap: 4px; }
.mini .e { font-size: 28px; }
.plancard { flex: none; width: 196px; background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; scroll-snap-align: start; display: flex; flex-direction: column; }
.plancard .tile { height: 84px; font-size: 38px; }
.plancard .body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 999px; background: var(--green-soft); color: var(--green); font-weight: 700; font-size: 12px; white-space: nowrap; }
.pill.y { background: var(--yellow-soft); color: var(--amber-text); }
.prog { font-weight: 800; font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1.5px solid var(--yellow); color: var(--amber-text); font-variant-numeric: tabular-nums; }
.prog.ok { border-color: var(--green); color: var(--green); }

.avatars { display: flex; align-items: center; }
.av { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 12px; border: 2px solid var(--surface); margin-left: -8px; flex: none; }
.avatars .av:first-child { margin-left: 0; }
.avatars .more { margin-left: 4px; font-size: 12px; font-weight: 800; }

.search { display: flex; align-items: center; gap: 8px; background: var(--surface-2); border-radius: 999px; padding: 0 14px; }
.search input { border: 0; background: transparent; flex: 1; min-width: 0; padding: 12px 0; outline: none; }

/* Barra superior de subpáginas */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 15; display: flex; align-items: center; gap: 4px;
  margin-inline: -16px; padding: 8px 8px; background: var(--bg);
}
.topbar.green { background: var(--green); color: #fff; }
.topbar .t { flex: 1; min-width: 0; }
.topbar .t b { display: block; font-family: var(--font-display); font-weight: 800; font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .t span { display: block; font-size: 12px; opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn { background: none; border: 0; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: inherit; flex: none; position: relative; }
.icon-btn:hover { background: color-mix(in srgb, currentColor 10%, transparent); }

/* Detalle */
.detail-hero { margin-inline: -16px; height: 190px; background: var(--green); display: grid; place-items: center; font-size: 92px; position: relative; }
.detail-hero .icon-btn { position: absolute; top: 10px; background: rgba(255,255,255,.92); color: #1B1D1B; }
.detail-hero .l { left: 12px; } .detail-hero .r { right: 12px; }
.discount { background: var(--yellow); color: #fff; font-family: var(--font-display); font-weight: 900; padding: 6px 12px; border-radius: 10px; flex: none; }
.actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; border-block: 1px solid var(--line); padding-block: 6px; }
.actions > * { background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 4px; border-radius: 10px; color: var(--fg); text-decoration: none; font-size: 13px; font-weight: 600; }
.actions svg { color: var(--green); }
ul.conds { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.card { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); padding: 12px 14px; }
.bottom-cta {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: linear-gradient(to top, var(--bg) 75%, transparent);
}
.bottom-cta > * { max-width: 448px; margin: 0 auto; display: flex; }

/* Formularios */
label.f { display: flex; flex-direction: column; gap: 6px; font-weight: 700; }
.input {
  width: 100%; border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 14px; font-weight: 400;
}
.input:focus { border-color: var(--green); outline: none; }
.input.err { border-color: #C62828; }
.hint { font-size: 12px; color: var(--muted); font-weight: 400; }
.hint.err { color: #C62828; }
.step { font-family: var(--font-display); font-weight: 800; font-size: 16px; }
input[type="range"] { width: 100%; accent-color: var(--green); }
.switch { appearance: none; width: 46px; height: 28px; border-radius: 14px; background: var(--line); position: relative; flex: none; transition: background .2s; border: 0; cursor: pointer; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
.switch:checked { background: var(--green); }
.switch:checked::after { transform: translateX(18px); }
.radio { display: flex; align-items: center; gap: 12px; padding: 12px 4px; border-bottom: 1px solid var(--line); }
.radio input { accent-color: var(--green); width: 20px; height: 20px; margin: 0; }

/* Chat */
.chat { display: flex; flex-direction: column; height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); margin-inline: -16px; }
.chat .topbar { margin-inline: 0; position: static; }
.chat-info { background: var(--surface); box-shadow: var(--shadow); padding: 10px 16px; display: flex; flex-direction: column; gap: 6px; }
.bar { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--yellow); border-radius: 4px; transition: width .4s; }
.bar.ok > i { background: var(--green); }
.msgs { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; }
.msg { display: flex; gap: 8px; align-items: flex-end; max-width: 85%; }
.msg.mine { align-self: flex-end; flex-direction: row-reverse; }
.bubble { padding: 8px 12px; border-radius: 16px; background: var(--surface-2); overflow-wrap: anywhere; }
.msg.mine .bubble { background: var(--mine); color: #fff; }
.msg .who { font-size: 12px; font-weight: 800; margin-bottom: 2px; }
.sys { align-self: center; background: var(--surface-2); padding: 5px 12px; border-radius: 999px; font-size: 12px; font-weight: 700; text-align: center; }
.composer { display: flex; gap: 8px; padding: 10px 16px; background: var(--bg); border-top: 1px solid var(--line); }
.composer .input { border-radius: 999px; }
.chat-cta { padding: 8px 16px 0; background: var(--bg); }

/* Canje */
.qr-card { background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; }
#qr { background: #fff; padding: 12px; border-radius: 12px; }
#qr img, #qr canvas { display: block; width: 200px; height: 200px; image-rendering: pixelated; }

/* Mis planes */
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); border-bottom: 1px solid var(--line); }
.tabs button { background: none; border: 0; padding: 12px 4px; font-weight: 700; color: var(--muted); border-bottom: 3px solid transparent; }
.tabs button[aria-selected="true"] { color: var(--green); border-bottom-color: var(--green); }
.prow { display: flex; gap: 12px; align-items: center; background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); padding: 10px; text-align: left; border: 0; width: 100%; }
.prow .tile { width: 64px; height: 64px; border-radius: 12px; font-size: 30px; }
.check { color: var(--green); font-weight: 900; font-size: 20px; text-align: center; }

/* Perfil */
.profile-head { margin-inline: -16px; background: var(--green); color: #fff; border-radius: 0 0 32px 32px; padding: 28px 16px 24px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
.profile-head .av { width: 84px; height: 84px; font-size: 34px; margin: 0; border-width: 3px; border-color: #fff; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; padding-block: 18px; }
.stats b { display: block; font-family: var(--font-display); font-size: 22px; font-weight: 900; color: var(--green); font-variant-numeric: tabular-nums; }
.rewards-card { background: var(--yellow-soft); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; border: 0; text-align: left; width: 100%; }
.rewards-card .bar { height: 10px; background: var(--surface); }
.menu-list { display: flex; flex-direction: column; margin-inline: -16px; margin-top: 12px; border-top: 1px solid var(--line); }
.menu-item { display: flex; align-items: center; gap: 14px; padding: 15px 20px; background: none; border: 0; border-bottom: 1px solid var(--line); text-align: left; width: 100%; }
.menu-item svg { color: var(--green); flex: none; }
.menu-item .tag { color: var(--yellow); font-weight: 800; font-size: 12px; }

.tier { display: flex; flex-direction: column; gap: 10px; }
.big-count { background: var(--green); color: #fff; border-radius: 20px; padding: 18px; text-align: center; }
.big-count b { display: block; font-family: var(--font-display); font-size: 56px; font-weight: 900; line-height: 1; }

.notif { display: flex; gap: 12px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); }
.notif .e { width: 44px; height: 44px; border-radius: 50%; background: var(--yellow-soft); display: grid; place-items: center; font-size: 20px; flex: none; }

/* Barra inferior */
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
  padding: 0 max(8px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(8px, env(safe-area-inset-left, 0px));
}
.nav > div { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; height: var(--nav-h); }
.nav button { background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; font-weight: 700; color: var(--muted); padding: 6px 0; }
.nav button[aria-current="page"] { color: var(--green); }
.nav button[aria-current="page"] svg { background: var(--green-soft); border-radius: 12px; padding: 2px 14px; width: 52px; }
.nav .plus { width: 52px; height: 52px; border-radius: 16px; background: var(--green); color: #fff; display: grid; place-items: center; margin: 0 auto; box-shadow: var(--shadow); }

/* Avisos */
#toast { position: fixed; z-index: 40; left: 50%; transform: translateX(-50%); top: calc(12px + env(safe-area-inset-top, 0px)); width: min(440px, calc(100% - 32px)); display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
.toast { background: var(--fg); color: var(--bg); padding: 12px 14px; border-radius: 14px; box-shadow: 0 6px 20px rgba(0,0,0,.2); font-weight: 600; animation: in .25s ease-out; }
@keyframes in { from { transform: translateY(-8px); opacity: 0; } }
/* ---------------------------------------------------------------- Ordenador: escaparate + móvil
   La app vive dentro de .phone-screen; su transform hace que los elementos "fixed" de la app
   (barra inferior, botones de abajo, avisos) se coloquen respecto a la pantalla del móvil. */
:root { --desk-bg: #EEF3EF; --desk-ink: #14231B; --device: #121513; }
:root.dark { --desk-bg: #0C0F0D; --desk-ink: #E6E8E5; --device: #000; }
html.desktop body { background: var(--desk-bg); }
.showcase {
  min-height: 100vh; display: grid; grid-template-columns: minmax(0, 540px) auto; align-items: center; justify-content: center;
  gap: clamp(40px, 6vw, 110px); padding-block: 16px; padding-left: max(48px, env(safe-area-inset-left, 0px)); padding-right: max(48px, env(safe-area-inset-right, 0px));
}
.pitch { display: flex; flex-direction: column; gap: 22px; color: var(--desk-ink); min-width: 0; }
.pitch .brand { width: 132px; height: auto; border-radius: 24px; background: #fff; padding: 10px; box-shadow: var(--shadow); transform: rotate(-4deg); }
.pitch .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--green); }
.pitch h1 { font-size: clamp(36px, 3.6vw, 54px); line-height: 1.04; font-weight: 900; }
.pitch h1 .ex { color: var(--teal); } .pitch h1 .pl { color: var(--yellow); }
.pitch .lead { font-size: 18px; line-height: 1.55; max-width: 34em; color: var(--muted); }
.pitch ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; counter-reset: s; }
.pitch li { display: grid; grid-template-columns: 40px 1fr; gap: 14px; align-items: start; counter-increment: s; }
.pitch li::before { content: counter(s); width: 40px; height: 40px; border-radius: 12px; background: var(--green); color: #fff; display: grid; place-items: center; font-family: var(--font-display); font-weight: 900; font-size: 18px; }
.pitch li b { display: block; font-size: 16px; color: var(--desk-ink); }
.pitch li > span > span { color: var(--muted); font-size: 15px; }
.facts { display: flex; flex-wrap: wrap; gap: 10px; }
.facts span { background: var(--surface); border-radius: 999px; padding: 6px 14px; font-weight: 700; font-size: 14px; box-shadow: var(--shadow); font-variant-numeric: tabular-nums; }
.facts b { color: var(--green); font-family: var(--font-display); font-weight: 900; }
.qr-pitch { display: flex; gap: 18px; align-items: center; background: var(--surface); border-radius: 20px; padding: 16px 18px; box-shadow: var(--shadow); max-width: 480px; }
.qr-pitch #site-qr { background: #fff; padding: 8px; border-radius: 12px; flex: none; }
.qr-pitch #site-qr img, .qr-pitch #site-qr canvas { display: block; width: 112px; height: 112px; image-rendering: pixelated; }
.qr-pitch b { font-family: var(--font-display); font-size: 18px; display: block; }

// ---------------------------------------------------------------- Navegación
const TABS = ["home", "explore", "myplans", "profile"];
let stack = [{ name: "home" }];
const ui = { cat: null, group: null, ecat: null, query: "", planTab: 0, menu: null, form: null, revealCode: null };
const cur = () => stack[stack.length - 1];
// La pila de pantallas va sincronizada con el historial del navegador, para que el botón
// Atrás del móvil haga lo mismo que la flecha de la app. Inicio es siempre la base:
// desde Explorar, Planes o Perfil, Atrás vuelve a Inicio, y desde Inicio sale de la web.
let pendingStack = null;   // pila que se aplica cuando termina un history.go() hacia atrás
let backFallback = null;   // por si el navegador no avisa del cambio (algunos visores embebidos)
function syncHistory(replace = false) {
  const state = { uniplan: stack.length - 1 };
  try { replace ? history.replaceState(state, "") : history.pushState(state, ""); } catch (e) { /* sin historial: la app sigue funcionando */ }
}
function show() { ui.menu = null; render(true); }
function go(name, params = {}) { stack.push({ name, ...params }); syncHistory(); show(); }
function replaceTop(name, params = {}) { stack[stack.length - 1] = { name, ...params }; syncHistory(true); show(); }
function back() {
  if (stack.length <= 1) return;
  clearTimeout(backFallback);
  backFallback = setTimeout(() => { if (stack.length > 1) { stack.pop(); syncHistory(true); show(); } }, 400);
  history.back();
}
// Cambia la pila entera: deshace en el historial las pantallas que sobran y añade las nuevas.
function resetTo(newStack) {
  const extra = stack.length - 1;
  if (extra > 0) {
    pendingStack = newStack;
    clearTimeout(backFallback);
    backFallback = setTimeout(() => { if (pendingStack) { pendingStack = null; applyStack(newStack); } }, 400);
    history.go(-extra);
    return;
  }
  applyStack(newStack);
}
function applyStack(newStack) {
  stack = [newStack[0]]; syncHistory(true);
  newStack.slice(1).forEach(s => { stack.push(s); syncHistory(); });
  show();
}
function tab(name) { resetTo(name === "home" ? [{ name: "home" }] : [{ name: "home" }, { name }]); }
addEventListener("popstate", e => {
  clearTimeout(backFallback);
  if (pendingStack) {
    const target = pendingStack; pendingStack = null;
    applyStack(target); return;
  }
  const depth = e.state && typeof e.state.uniplan === "number" ? e.state.uniplan : 0;
  if (depth < stack.length - 1) { stack = stack.slice(0, depth + 1); show(); }
  else if (depth > stack.length - 1) history.go(stack.length - 1 - depth); // "Adelante": no hay pantalla que recuperar
});

// ---------------------------------------------------------------- Acciones
function notify(emoji, text, kind) {
  S.notifications.unshift({ id: S.nextId++, emoji, text, time: "Ahora" });
  S.unread++;
  if (S.notify[kind]) toast(`${emoji} ${text}`);
}
function sys(planId, text) { S.messages.push({ id: S.nextId++, plan: planId, author: "", text, sys: true }); }
function replacePlan(p) { const i = S.plans.findIndex(x => x.id === p.id); if (i >= 0) S.plans[i] = p; }
function checkUnlocked(before, after) {
  const c = couponOf(after);
  if (c && !unlocked(before) && unlocked(after)) {
    sys(after.id, `Cupón desbloqueado (${after.members.length}/${c.min} personas) 🎉`);
    if (after.members.includes(ME)) notify("🎁", `¡Cupón desbloqueado! ${c.title} en ${BIZ[c.biz].name}`, "plans");
  }
}
function checkRewards(before) {
  const now = plansThisMonth();
  TIERS.filter(t => before < t.need && now >= t.need).forEach(t => notify(t.emoji, `¡Premio desbloqueado! Ya puedes canjear: ${t.title}`, "rewards"));
}
function joinPlan(id) {
  const p = plan(id);
  if (!p || p.members.includes(ME) || p.members.length >= p.max) return;
  const after = { ...p, members: [...p.members, ME] };
  replacePlan(after); sys(id, "Te has unido al plan"); checkUnlocked(p, after); save();
}
function leavePlan(id) {
  const p = plan(id); if (!p || p.completed) return;
  replacePlan({ ...p, members: p.members.filter(m => m !== ME) }); sys(id, "Has salido del plan"); save();
}
function createPlan(f) {
  const id = "p" + S.nextId++;
  const c = f.couponId ? CPN[f.couponId] : null;
  const p = {
    id, title: f.title, emoji: f.emoji, city: c ? BIZ[c.biz].city : S.city, place: f.place, maps: f.maps || null,
    when: f.when, creator: ME, members: [ME], max: f.max, couponId: f.couponId || null, erasmus: f.erasmus, redeemed: false, completed: false,
  };
  S.plans.unshift(p);
  sys(id, c ? `Plan creado. Faltan ${c.min - 1} personas para desbloquear "${c.title}"` : "Plan creado. Comparte el plan para que se una más gente");
  save(); simulateJoins(id); return id;
}
function simulateJoins(id) {
  const names = [...FAKE].sort(() => Math.random() - .5).slice(0, 3);
  names.forEach((name, k) => setTimeout(() => {
    const p = plan(id);
    if (!p || !p.members.includes(ME) || p.completed || p.members.length >= p.max || p.members.includes(name)) return;
    const after = { ...p, members: [...p.members, name] };
    replacePlan(after); sys(id, `${name} se ha unido al plan`);
    notify("👋", `${name} se ha unido a tu plan "${p.title}"`, "plans");
    checkUnlocked(p, after); save(); softRender();
  }, 4000 * (k + 1)));
}
function sendMessage(id, text) {
  text = text.trim(); if (!text) return;
  S.messages.push({ id: S.nextId++, plan: id, author: ME, text, sys: false }); save();
  const others = plan(id).members.filter(m => m !== ME);
  if (others.length) setTimeout(() => {
    S.messages.push({ id: S.nextId++, plan: id, author: others[Math.floor(Math.random() * others.length)], text: REPLIES[Math.floor(Math.random() * REPLIES.length)], sys: false });
    save(); softRender();
  }, 1500);
}
function redeemPlan(id) {
  const p = plan(id), c = p && couponOf(p);
  if (!c || !unlocked(p) || p.redeemed) return;
  const before = plansThisMonth();
  replacePlan({ ...p, redeemed: true, completed: true });
  sys(id, `Cupón canjeado en ${BIZ[c.biz].name} ✅`);
  notify("✅", `Has canjeado "${c.title}" y ahorrado ${euros(c.save)}`, "plans");
  checkRewards(before); save();
}
function completePlan(id) {
  const p = plan(id); if (!p || p.completed || p.couponId || !unlocked(p)) return;
  const before = plansThisMonth();
  replacePlan({ ...p, completed: true }); sys(id, "¡Plan completado! Suma a vuestros premios del mes 🏆");
  checkRewards(before); save();
}
function redeemCoupon(cid) {
  const c = CPN[cid]; if (c.min > 1 || S.redeemedCoupons.includes(cid)) return;
  S.redeemedCoupons.push(cid);
  notify("✅", `Has canjeado "${c.title}" en ${BIZ[c.biz].name} y ahorrado ${euros(c.save)}`, "coupons"); save();
}
function claimReward(tid) {
  const t = TIERS.find(x => x.id === tid);
  if (plansThisMonth() < t.need || S.claimed[tid]) return;
  S.claimed[tid] = "DEMO-" + [0, 0, 0].map(() => 1000 + Math.floor(Math.random() * 9000)).join("-");
  notify(t.emoji, `Has canjeado tu premio: ${t.title}`, "rewards"); save();
}
function toast(text) {
  const el = document.createElement("div"); el.className = "toast"; el.textContent = text;
  $("#toast").appendChild(el); setTimeout(() => el.remove(), 3500);
}
async function copy(text, okMsg = "Copiado") {
  try { await navigator.clipboard.writeText(text); toast(okMsg); }
  catch (e) { toast("No se pudo copiar automáticamente: " + text); }
}

function chatInfo(p) {

  return `<div class="row"><b class="grow">${c ? `${c.emoji} ${esc(c.title)}` : `${p.emoji} ${esc(p.title)}`}</b>${p.erasmus ? `<span class="pill">🌍 Erasmus</span>` : ""}</div>

    <div class="bar ${ok ? "ok" : ""}"><i style="width:${Math.min(100, p.members.length / need * 100)}%"></i></div>
    <span class="small">${status}</span>
    <span class="tiny muted">${p.members.map(esc).join(" · ")}</span>`;
}

        ${code && ui.revealCode === t.id ? `<div class="card" style="background:var(--green-soft);text-align:center"><b style="font-size:20px;letter-spacing:.04em">${code}</b><p class="tiny muted">Código de demostración, no es real</p><button class="btn text" data-act="copy" data-v="${code}">Copiar</button></div>` : ""}
      </div>`;
    }).join("")}
    <h3>¿Qué cuenta como plan?</h3>
    <p class="muted">Cada plan completado con al menos 2 personas: al canjear un cupón de grupo en un comercio, o al marcar en el chat que el plan se ha hecho. Los cupones individuales no cuentan. El contador se reinicia el día 1 de cada mes.</p>
  </div>`;
};

screens.settings = () => `${topbar("Ajustes")}

    <h3 style="color:var(--green);margin-top:12px">Avisos</h3>
    <p class="small muted">En la versión web los avisos aparecen dentro de la app. Las notificaciones del móvil están en la app de Android.</p>
    ${[["plans", "Planes y chats", "Cuando alguien se une a tu plan o se desbloquea un cupón"], ["coupons", "Cupones", "Canjes y nuevas ofertas de comercios cerca de ti"], ["rewards", "Premios mensuales", "Cuando desbloqueas un premio"]].map(([k, t, d]) =>
      `<label class="row" style="justify-content:space-between;gap:12px;padding:8px 0"><span><b>${t}</b><br><span class="small muted">${d}</span></span><input type="checkbox" class="switch" data-act="notify" data-v="${k}" ${S.notify[k] ? "checked" : ""}></label>`).join("")}

    ${ui.menu === "reset" ? `<div class="card stack"><b>¿Reiniciar la demo?</b><p class="small">Se borrarán tus planes, mensajes y canjes de esta demo.</p><div class="row"><button class="btn" data-act="reset-yes">Sí, reiniciar</button><button class="btn text" data-act="menu" data-v="">Cancelar</button></div></div>`
      : `<button class="btn ghost" style="align-self:flex-start" data-act="menu" data-v="reset">Reiniciar demo</button>`}
    <p class="small muted" style="margin-top:12px">UniPlan web 0.5 · versión de demostración</p>
  </div>`;

screens.invite = () => {

screens.privacy = () => `${topbar("Privacidad y datos")}
  <div class="stack"><p>UniPlan trata tus datos conforme al RGPD y la LOPDGDD. Tu correo institucional solo se usa para verificar que eres estudiante.</p>

        <span class="hint ${v.err ? "err" : ""}">${esc(v.err || "Solo estudiantes verificados de la Universidad de Extremadura")}</span></label>
      <label class="row small"><input type="checkbox" id="v-ok1" ${v.ok1 ? "checked" : ""}> Acepto la política de privacidad (RGPD y LOPDGDD)</label>

// ---------------------------------------------------------------- Render
function applyTheme() {
  const dark = S.theme === "dark" || (S.theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.classList.toggle("dark", dark);
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.content = dark ? "#121412" : "#F7F7F5";
}
function navBar(active) {
  const b = (n, l, icon) => `<button data-act="tab" data-v="${n}" ${active === n ? 'aria-current="page"' : ""}>${icon}<span>${l}</span></button>`;
  return `<nav class="nav" aria-label="Principal"><div>${b("home", "Inicio", I.home)}${b("explore", "Explorar", I.search)}
    <button data-go="create" aria-label="Crear plan"><span class="plus">${I.plus}</span></button>${b("myplans", "Planes", I.cal)}${b("profile", "Perfil", I.user)}</div></nav>`;
}
function render(scrollTop = false) {
  applyTheme();
  const s = cur(), isTab = TABS.includes(s.name);
  const app = $("#app");
  app.className = isTab ? "" : s.name === "chat" ? "chat-mode" : "no-nav";
  app.innerHTML = (screens[s.name] || screens.home)(s) + (isTab ? navBar(s.name) : "");
  if (scrollTop) (scroller || window).scrollTo(0, 0);
  afterRender(s);
}
function afterRender(s) {
  const qr = $("#qr");
  if (qr && window.QRCode) new QRCode(qr, { text: qr.dataset.text, width: 400, height: 400, correctLevel: QRCode.CorrectLevel.M });
  else if (qr) qr.textContent = "No se pudo cargar el generador de QR.";
  if (s.name === "chat") { const m = $("#msgs"); if (m) m.scrollTop = m.scrollHeight; }
  if (s.name === "create") updateCreateForm();
}
// Actualiza sin redibujar la pantalla entera mientras se escribe (para no cerrar el teclado).
function softRender() {
  const s = cur(), typing = document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName);
  if (s.name === "chat") {
    const p = plan(s.id), msgs = $("#msgs");
    if (p && msgs) {
      const atBottom = msgs.scrollHeight - msgs.scrollTop - msgs.clientHeight < 80;
      $("#chat-info").innerHTML = chatInfo(p); msgs.innerHTML = chatMsgs(p); $("#chat-cta").innerHTML = chatCta(p);
      if (atBottom) msgs.scrollTop = msgs.scrollHeight;
      return;
    }
  }
  if (!typing) render();
}

// ---------------------------------------------------------------- Eventos
function updateCreateForm() {
  const f = ui.form; if (!f) return;
  const btn = $("#f-mapsbtn");
  if (btn) {
    btn.href = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(`${f.place} ${S.city}`.trim());
    btn.style.opacity = f.place.trim() ? "1" : ".45"; btn.style.pointerEvents = f.place.trim() ? "" : "none";
  }
  const mapsBad = f.maps.trim() && !isMaps(f.maps.trim());
  const mi = $("#f-maps"), mh = $("#f-maps-hint");
  if (mi) { mi.classList.toggle("err", !!mapsBad); mh.classList.toggle("err", !!mapsBad); mh.textContent = mapsBad ? "Eso no parece un enlace de Google Maps" : "En Google Maps, mantén pulsado el sitio para marcarlo → Compartir → Copiar enlace, y pégalo aquí."; }
  const hi = $("#f-hour"); if (hi) hi.classList.toggle("err", !hourOk(f.hour));
  $("#f-max-label").textContent = `4. ¿Cuánta gente? Hasta ${f.max} personas`;
  $("#f-submit").disabled = !formValid(f);
}
document.addEventListener("input", e => {
  const t = e.target, f = ui.form;
  if (t.id === "q") { ui.query = t.value; $("#results").innerHTML = exploreResults(); return; }
  if (f && t.id && t.id.startsWith("f-")) {
    if (t.id === "f-title") f.title = t.value;
    if (t.id === "f-place") f.place = t.value;
    if (t.id === "f-maps") f.maps = t.value;
    if (t.id === "f-hour") f.hour = t.value;
    if (t.id === "f-max") f.max = Number(t.value);
    if (t.id === "f-erasmus") f.erasmus = t.checked;
    updateCreateForm();
  }
  const v = ui.verify;
  if (v) {
    if (t.id === "v-name") v.name = t.value;
    if (t.id === "v-email") v.email = t.value;
    if (t.id === "v-code") v.code = t.value.replace(/\D/g, "");
  }
});
document.addEventListener("change", e => {
  const t = e.target, act = t.dataset.act;
  if (act === "theme") { S.theme = t.value; save(); render(); }
  if (act === "notify") { S.notify[t.dataset.v] = t.checked; save(); }
  if (t.id === "f-erasmus" && ui.form) ui.form.erasmus = t.checked;
  if (ui.verify) { if (t.id === "v-ok1") ui.verify.ok1 = t.checked; if (t.id === "v-ok2") ui.verify.ok2 = t.checked; }
});
document.addEventListener("submit", e => {
  e.preventDefault();
  if (e.target.id === "composer") {
    const input = $("#msg"); sendMessage(cur().id, input.value); input.value = ""; softRender(); input.focus();
  }
});
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => { if (S.theme === "system") applyTheme(); });

// ---------------------------------------------------------------- Ordenador: escaparate
const DESKTOP = matchMedia("(min-width: 900px) and (hover: hover) and (pointer: fine)");
let scroller = null, clockTimer = null;
function pitchHTML() {
  const shops = DATA.biz.length, coupons = DATA.coupons.length, solo = DATA.coupons.filter(c => c.min === 1).length;
  return `<section class="pitch">
    <img class="brand" src="${LOGO}" alt="UniPlan" width="310" height="304">
    <span class="eyebrow">Badajoz · Cáceres · Universidad de Extremadura</span>
    <h1>El cupón es la <span class="ex">excusa</span>, el grupo es el <span class="pl">plan</span>.</h1>
    <p class="lead">UniPlan conecta a los estudiantes de la UEx con los comercios de su ciudad. Los descuentos se desbloquean cuando quedáis en grupo: ahorras tú, gana el comercio local y el chat de clase se convierte en un plan de verdad.</p>
    <ol>
      <li><span><b>Elige un cupón</b><span>De bares, restaurantes y comercio local: zapaterías, papelerías, carnicerías…</span></span></li>
      <li><span><b>Únete o crea un plan</b><span>El grupo se organiza en el chat y el cupón se desbloquea al llegar al mínimo de personas.</span></span></li>
      <li><span><b>Quedad y canjead</b><span>Enseñáis el QR en el local. Cada plan suma para los premios del mes.</span></span></li>
    </ol>
    <div class="facts"><span><b>${shops}</b> comercios</span><span><b>${coupons}</b> cupones</span><span><b>${solo}</b> individuales</span><span><b>0 €</b> para estudiantes</span></div>
    <div class="qr-pitch"><div id="site-qr" aria-label="Código QR para abrir UniPlan en el móvil"></div>
      <div><b>Ábrela en tu móvil</b><p class="small muted">Escanea el código o entra en <code>uniplanuex.github.io</code>. Funciona en Android y iPhone; añádela a la pantalla de inicio para usarla como una app.</p></div></div>
  </section>`;
}
const STATUS_ICONS = '<span class="icons"><svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor" aria-hidden="true"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor" aria-hidden="true"><path d="M8 2.5c2.3 0 4.4.9 6 2.4l1.4-1.5A10.6 10.6 0 008 .5 10.6 10.6 0 00.6 3.4L2 4.9a8.6 8.6 0 016-2.4zm0 4c1.2 0 2.3.5 3.2 1.2l1.4-1.4A6.6 6.6 0 008 4.5c-1.8 0-3.4.7-4.6 1.8l1.4 1.4A4.6 4.6 0 018 6.5zm0 4l2-2a2.9 2.9 0 00-4 0z"/></svg><svg width="26" height="12" viewBox="0 0 26 12" aria-hidden="true"><rect x=".5" y=".5" width="22" height="11" rx="3" fill="none" stroke="currentColor" opacity=".5"/><rect x="2" y="2" width="17" height="8" rx="2" fill="currentColor"/><rect x="23.5" y="4" width="2" height="4" rx="1" fill="currentColor" opacity=".5"/></svg></span>';
function setupLayout() {
  const app = $("#app"), toastEl = $("#toast"), existing = document.querySelector(".showcase");
  if (DESKTOP.matches && !existing) {
    document.documentElement.classList.add("desktop");
    const wrap = document.createElement("div");
    wrap.className = "showcase";
    wrap.innerHTML = pitchHTML() + `<div class="device-wrap"><div class="device"><div class="phone-screen">
      <div class="status"><span id="clock"></span>${STATUS_ICONS}</div><div class="phone-scroll" id="scroller"></div>
    </div></div><p class="device-hint">Demo interactiva: úsala con el ratón</p></div>`;
    document.body.insertBefore(wrap, app);
    $("#scroller").appendChild(app);
    document.querySelector(".phone-screen").appendChild(toastEl);
    scroller = $("#scroller");
    const qr = $("#site-qr");
    if (window.QRCode) new QRCode(qr, { text: SITE_URL, width: 256, height: 256, correctLevel: QRCode.CorrectLevel.M });
    else qr.hidden = true;
    const tick = () => { const c = $("#clock"); if (c) c.textContent = new Date().toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" }); };
    tick(); clockTimer = setInterval(tick, 15000);
  } else if (!DESKTOP.matches && existing) {
    document.documentElement.classList.remove("desktop");
    document.body.insertBefore(app, existing);
    document.body.insertBefore(toastEl, existing);
    existing.remove(); scroller = null; clearInterval(clockTimer);
  }
}
DESKTOP.addEventListener?.("change", () => { setupLayout(); render(); });

// Con ratón, las filas que se deslizan de lado (categorías, planes…) se pueden arrastrar.
let drag = null, suppressClick = false;
document.addEventListener("pointerdown", e => {
  if (e.pointerType !== "mouse" || e.button !== 0) return;
  const el = e.target.closest(".chips, .hscroll");
  if (el && el.scrollWidth > el.clientWidth) drag = { el, x: e.clientX, left: el.scrollLeft, moved: false };
});
document.addEventListener("pointermove", e => {
  if (!drag) return;
  const dx = e.clientX - drag.x;
  if (!drag.moved && Math.abs(dx) > 6) { drag.moved = true; document.documentElement.classList.add("dragging"); }
  if (drag.moved) drag.el.scrollLeft = drag.left - dx;
});
document.addEventListener("pointerup", () => {
  if (drag && drag.moved) { suppressClick = true; setTimeout(() => { suppressClick = false; }, 0); }
  document.documentElement.classList.remove("dragging"); drag = null;
});
document.addEventListener("click", e => { if (suppressClick) { e.preventDefault(); e.stopPropagation(); } }, true);

document.addEventListener("click", e => {
  const el = e.target.closest("[data-go],[data-act]");
  if (!el) { if (ui.menu && ui.menu !== "reset") { ui.menu = null; render(); } return; }
  if (el.tagName === "A") return;
  const d = el.dataset;
  if (d.go) {
    e.preventDefault();
    const params = {};
    if (d.id) params.id = d.id;
    if (d.plan) params.plan = d.plan;
    if (d.coupon) params.coupon = d.coupon;
    if (d.go === "create") ui.form = null;
    if (d.go === "verify") ui.verify = null;
    go(d.go, params); return;
  }
  const act = d.act, v = d.v;
  if (act === "theme" || act === "notify") return; // los gestiona "change"
  e.preventDefault();
  switch (act) {
    case "back": back(); break;
    case "tab": tab(v); break;
    case "menu": ui.menu = ui.menu === v || !v ? null : v; render(); break;
    case "city": S.city = v; ui.menu = null; save(); render(); break;
    case "cat": ui.cat = v || null; render(); break;
    case "ecat": ui.ecat = v || null; $("#results").innerHTML = exploreResults(); document.querySelectorAll('[data-act="ecat"]').forEach(b => b.setAttribute("aria-pressed", String((b.dataset.v || null) === ui.ecat))); break;
    case "group": ui.group = v === "null" ? null : v === "true"; render(); break;
    case "fav": { const i = S.favorites.indexOf(d.id); i >= 0 ? S.favorites.splice(i, 1) : S.favorites.push(d.id); save(); render(); break; }
    case "join-open": joinPlan(d.id); go("chat", { id: d.id }); break;
    case "join": joinPlan(d.id); render(); break;
    case "leave": ui.menu = null; leavePlan(d.id); render(); break;
    case "complete": completePlan(d.id); softRender(); break;
    case "redeem-plan": redeemPlan(d.id); render(); break;
    case "redeem-coupon": redeemCoupon(d.id); render(); break;
    case "claim": claimReward(d.id); ui.revealCode = d.id; render(); break;
    case "show-code": ui.revealCode = ui.revealCode === d.id ? null : d.id; render(); break;
    case "copy": copy(v); break;
    case "ptab": ui.planTab = Number(v); render(); break;
    case "ptype": ui.form.type = Number(v); render(); break;
    case "pday": ui.form.day = v; render(); break;
    case "create": {
      const f = ui.form; if (!formValid(f)) break;
      const c = f.couponId ? CPN[f.couponId] : null, b = c ? BIZ[c.biz] : null, [tl, te] = PLAN_TYPES[f.type];
      const id = createPlan({
        couponId: f.couponId, emoji: c ? c.emoji : te,
        title: f.title.trim() || `${tl} en ${b ? b.name : f.place.trim()}`,
        place: b ? `${b.name} · ${b.address}` : f.place.trim(),
        maps: f.maps.trim(), when: `${f.day}, ${f.hour}`, max: f.max, erasmus: f.erasmus,
      });
      ui.form = null; replaceTop("chat", { id }); break;
    }
    case "share-coupon": { const c = CPN[d.id]; copy(`¿Nos vamos de UniPlan? ${c.title} en ${BIZ[c.biz].name} 🎉 El cupón es la excusa, el grupo es el plan.`, "Mensaje copiado para compartir"); break; }
    case "share-plan": { const p = plan(d.id); ui.menu = null; copy(`¡Únete a mi UniPlan "${p.title}"! ${p.when} en ${p.place}. ${mapsUrl(p)}`, "Plan copiado para compartir"); render(); break; }
    case "test-toast": toast("🎉 Así se ven los avisos de UniPlan"); break;
    case "reset-yes": S = initialState(); save(); toast("Demo reiniciada"); tab("profile"); break;
    case "verify-send": {
      const vv = ui.verify;
      vv.err = !vv.name.trim() ? "Escribe tu nombre" : !/^[A-Za-z0-9._%+-]+@(alumnos\.)?unex\.es$/i.test(vv.email.trim()) ? "Usa tu correo @alumnos.unex.es o @unex.es" : !(vv.ok1 && vv.ok2) ? "Acepta la privacidad y confirma tu edad" : "";
      if (!vv.err) { vv.step = 1; vv.sent = String(100000 + Math.floor(Math.random() * 900000)); vv.code = ""; }
      render(); break;
    }
    case "verify-check": {
      const vv = ui.verify;
      if (vv.code === vv.sent) {
        S.user = { ...S.user, name: vv.name.trim(), email: vv.email.trim().toLowerCase() }; save();
        ui.verify = null; toast("✅ Correo verificado"); back();
      } else { vv.err = "Código incorrecto"; render(); }
      break;
    }
    case "verify-reset": ui.verify.step = 0; ui.verify.err = ""; render(); break;
  }
});

setupLayout();
syncHistory(true);
render();
</script>

if ("serviceWorker" in navigator) {
